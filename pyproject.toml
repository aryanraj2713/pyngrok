[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyngrok-cli"
version = "0.1.0"
description = "A Python command center for Rust-powered reverse tunnels"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typer>=0.16,<1", "rich>=14,<16"]

[project.scripts]
pyngrok = "pyngrok.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "ty>=0.0.1"]
packaging = ["pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyngrok = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
